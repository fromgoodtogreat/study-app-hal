<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- iPadの「ホーム画面に追加」で全画面アプリとして起動するための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="伴走ナビ" />
  <title>中学受験 伴走ナビ - パーソナルコーチ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (丸みのある落ち着いた日本語フォント) -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- React & ReactDOM & Babel (1ファイルでどのブラウザでも動く構成) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F3EFE6;
      color: #3D352E;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* スクロールバーをすっきりさせる */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #D8C5A5;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 科目別カラー設定（落ち着いたアースカラー） ---
    const SUBJECT_STYLES = {
      四科: { bg: 'bg-[#E6EFE9]', text: 'text-[#3B6E52]', border: 'border-[#B8D4C4]', hex: '#4B8364' },
      算数: { bg: 'bg-[#E6EFE9]', text: 'text-[#3B6E52]', border: 'border-[#B8D4C4]', hex: '#4B8364' },
      国語: { bg: 'bg-[#F5E6E4]', text: 'text-[#A64B44]', border: 'border-[#E2B8B3]', hex: '#C86D65' },
      理科: { bg: 'bg-[#FDF3DC]', text: 'text-[#9C711C]', border: 'border-[#EED59A]', hex: '#D49B35' },
      社会: { bg: 'bg-[#E8EEF5]', text: 'text-[#3E5F8A]', border: 'border-[#C2D4E8]', hex: '#547AA5' }
    };

    const SCHOOL_COLORS = ['#4B8364', '#C86D65', '#D49B35', '#547AA5', '#8C659C'];

    // --- 単元マップの標準カリキュラム定義（小4・四谷大塚ベース） ---
    const CURRICULUM_MAP = {
      算数: [
        { category: '数と計算', units: ['整数・小数の計算', '単位の換算', '分数の計算', '還元算(□を求める)', 'およその数（概数）'] },
        { category: '文章題（特殊算）', units: ['和差算', '植木算', '分配算', 'つるかめ算', '消去算', '過不足算・差集め算'] },
        { category: '数の性質・規則性', units: ['約数と倍数', 'あまりと整数の問題', '周期算', '等差数列', '方陣算'] },
        { category: '平面・立体図形', units: ['角度', '正方形と長方形の面積', '三角形と四角形の面積', '円とおうぎ形', '直方体と立方体'] }
      ],
      国語: [
        { category: '漢字・知識', units: ['漢字の読み書き', '四字熟語・ことわざ', '慣用句', '敬語・文法', '同音異義語・類義語'] },
        { category: '物語・小説文', units: ['登場人物の心情理解', '場面の移り変わり', '行動の理由説明', '主題の把握'] },
        { category: '説明・論説文', units: ['接続語・指示語', '段落の役割と構成', '筆者の主張・要旨', '抜き出し・要約記述'] }
      ],
      理科: [
        { category: '生物と環境', units: ['春の生物', '夏の生物', '昆虫のからだ', '植物のつくりと成長', 'ヒトのからだ'] },
        { category: '物質とエネルギー', units: ['磁石の性質', '乾電池と豆電球', '光と鏡の性質', '空気と水の性質', 'ものの温度と体積'] },
        { category: '地球と宇宙', units: ['星座と星の動き', '月の満ち欠け', '天気と気温の変化', '流れる水のはたらき'] }
      ],
      社会: [
        { category: '日本の地理（基礎）', units: ['都道府県と県庁所在地', '地図記号と縮尺', '日本の地形・川・平野', '日本の気候区分'] },
        { category: 'くらしと産業', units: ['日本の農業（米・野菜）', '水産業と漁港', 'ゴミ処理とリサイクル', '上水道と電力・防災'] },
        { category: '地方別の特色', units: ['九州地方', '中国・四国地方', '近畿地方', '中部・関東・東北・北海道'] }
      ]
    };

    // --- かわいい「もちくま」SVGイラスト ---
    const MochiKumaIcon = ({ size = 48, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 100 100" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="28" r="12" fill="#E3B788" />
        <circle cx="26" cy="28" r="6" fill="#F4D7B6" />
        <circle cx="74" cy="28" r="12" fill="#E3B788" />
        <circle cx="74" cy="28" r="6" fill="#F4D7B6" />
        <path d="M50 18 C48 8, 36 8, 40 16 C43 20, 48 19, 50 18 Z" fill="#68A36E" />
        <path d="M50 18 C52 8, 64 8, 60 16 C57 20, 52 19, 50 18 Z" fill="#81B887" />
        <path d="M50 16 L50 23" stroke="#538558" strokeWidth="2.5" strokeLinecap="round" />
        <rect x="18" y="22" width="64" height="62" rx="31" fill="#ECC59A" />
        <ellipse cx="50" cy="60" rx="22" ry="18" fill="#FFF7EB" />
        <ellipse cx="29" cy="52" rx="5" ry="3" fill="#F09C8B" opacity="0.7" />
        <ellipse cx="71" cy="52" rx="5" ry="3" fill="#F09C8B" opacity="0.7" />
        <path d="M34 45 Q38 40 42 45" stroke="#5C4433" strokeWidth="3" strokeLinecap="round" fill="none" />
        <path d="M58 45 Q62 40 66 45" stroke="#5C4433" strokeWidth="3" strokeLinecap="round" fill="none" />
        <ellipse cx="50" cy="48" rx="3.5" ry="2.5" fill="#5C4433" />
        <path d="M46 52 Q50 56 54 52" stroke="#5C4433" strokeWidth="2.5" strokeLinecap="round" fill="none" />
        <ellipse cx="22" cy="60" rx="6" ry="9" transform="rotate(-20 22 60)" fill="#E3B788" />
        <ellipse cx="78" cy="60" rx="6" ry="9" transform="rotate(20 78 60)" fill="#E3B788" />
        <ellipse cx="36" cy="84" rx="8" ry="5" fill="#D5A676" />
        <ellipse cx="64" cy="84" rx="8" ry="5" fill="#D5A676" />
      </svg>
    );

    // --- 外部ライブラリ不要のカスタム高精細SVG折れ線グラフコンポーネント ---
    // （単体HTMLとして外部環境に置いても確実に崩れず描画される設計）
    const CustomPerformanceChart = ({ data, metric, subject, schools }) => {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const width = 620;
      const height = 250;
      const padLeft = 44;
      const padRight = 95;
      const padTop = 24;
      const padBottom = 38;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const isDev = metric === 'deviation';
      const minVal = isDev ? 35 : 0;
      const maxVal = isDev ? 75 : Math.max(100, ...data.map(d => d.maxScore || 100));

      const getY = (val) => {
        const clamped = Math.max(minVal, Math.min(maxVal, val));
        return padTop + plotH - ((clamped - minVal) / (maxVal - minVal)) * plotH;
      };

      const getX = (idx) => {
        if (data.length <= 1) return padLeft + plotW / 2;
        return padLeft + (idx / (data.length - 1)) * plotW;
      };

      const points = data.map((d, i) => ({
        x: getX(i),
        y: getY(isDev ? d.deviation : d.score),
        raw: d
      }));

      const pathData = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const yTicks = isDev ? [40, 50, 60, 70] : [0, Math.round(maxVal * 0.5), maxVal];
      const strokeColor = SUBJECT_STYLES[subject]?.hex || '#4B8364';

      return (
        <div className="relative w-full bg-[#FAF8F5] p-3 rounded-2xl border border-[#EAE3D5]">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
            {/* 横グリッド線 */}
            {yTicks.map(t => {
              const y = getY(t);
              return (
                <g key={t}>
                  <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke="#E5DEC9" strokeDasharray="3 3" />
                  <text x={padLeft - 8} y={y + 4} textAnchor="end" fontSize="11" fill="#7A6F63" fontWeight="bold">
                    {t}
                  </text>
                </g>
              );
            })}

            {/* 志望校の合格目標偏差値ライン */}
            {isDev && schools.map(s => {
              const y = getY(Number(s.targetDeviation));
              return (
                <g key={s.id}>
                  <line
                    x1={padLeft}
                    y1={y}
                    x2={width - padRight}
                    y2={y}
                    stroke={s.color}
                    strokeWidth="1.8"
                    strokeDasharray="5 4"
                  />
                  <text
                    x={width - padRight + 6}
                    y={y + 4}
                    fontSize="10"
                    fontWeight="bold"
                    fill={s.color}
                  >
                    {s.name.slice(0, 6)}({s.targetDeviation})
                  </text>
                </g>
              );
            })}

            {/* 成績の折れ線 */}
            {points.length > 1 && (
              <path d={pathData} fill="none" stroke={strokeColor} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
            )}

            {/* データポイント */}
            {points.map((p, i) => (
              <g
                key={i}
                className="cursor-pointer"
                onMouseEnter={() => setHoveredIdx(i)}
                onMouseLeave={() => setHoveredIdx(null)}
                onClick={() => setHoveredIdx(hoveredIdx === i ? null : i)}
              >
                <circle cx={p.x} cy={p.y} r="7" fill={strokeColor} stroke="#FFFDF9" strokeWidth="2.5" />
                <text x={p.x} y={p.y - 11} textAnchor="middle" fontSize="11" fontWeight="800" fill="#3D352E">
                  {isDev ? p.raw.deviation : `${p.raw.score}点`}
                </text>
                <text x={p.x} y={height - 10} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#7A6F63">
                  {p.raw.name.slice(0, 7)}
                </text>
              </g>
            ))}
          </svg>

          {/* タップ・ホバー時の詳細ツールチップ */}
          {hoveredIdx !== null && points[hoveredIdx] && (
            <div className="mt-2 bg-[#FFFDF9] border border-[#D8C5A5] px-4 py-2 rounded-xl text-xs flex flex-wrap items-center justify-between gap-2 shadow-sm">
              <span className="font-extrabold text-[#3D352E]">
                {points[hoveredIdx].raw.name}（{points[hoveredIdx].raw.type} / {points[hoveredIdx].raw.course}）
              </span>
              <span className="font-bold text-[#4B8364]">
                {subject}偏差値: {points[hoveredIdx].raw.deviation} ／ 得点: {points[hoveredIdx].raw.score}/{points[hoveredIdx].raw.maxScore}点
              </span>
            </div>
          )}
        </div>
      );
    };

    const STORAGE_KEY = 'chugaku_juken_bansou_navi_v1';

    function App() {
      // 'home' | 'upload' | 'unitMap' | 'dojo' | 'flashcards' | 'schools' | 'records' | 'share'
      const [activeView, setActiveView] = useState('home');

      // --- 初期状態はすべて空（子ども・保護者が後から追加する） ---
      const [studentName, setStudentName] = useState('');
      const [tests, setTests] = useState([]);
      const [schools, setSchools] = useState([
        { id: 's-1', name: '', targetDeviation: '', color: SCHOOL_COLORS[0] },
        { id: 's-2', name: '', targetDeviation: '', color: SCHOOL_COLORS[1] },
        { id: 's-3', name: '', targetDeviation: '', color: SCHOOL_COLORS[2] },
        { id: 's-4', name: '', targetDeviation: '', color: SCHOOL_COLORS[3] },
        { id: 's-5', name: '', targetDeviation: '', color: SCHOOL_COLORS[4] }
      ]);
      const [flashcards, setFlashcards] = useState([]);
      const [acorns, setAcorns] = useState(0);
      const [solvedQuestionIds, setSolvedQuestionIds] = useState([]);
      const [studyLogs, setStudyLogs] = useState([]);
      const [customApiKey, setCustomApiKey] = useState(''); // 外部サイトでAI生成を使う場合の任意キー

      // --- フィルター＆設定ステート ---
      const [selectedSubject, setSelectedSubject] = useState('算数');
      const [chartSubject, setChartSubject] = useState('四科');
      const [includeCurriculum, setIncludeCurriculum] = useState(false);
      const [chartMetric, setChartMetric] = useState('deviation');
      const [accuracyThreshold, setAccuracyThreshold] = useState(50); // 30, 40, 50%

      // --- トースト通知 ---
      const [toast, setToast] = useState(null);
      const showToast = (text, acornGain = 0) => {
        if (acornGain > 0) setAcorns(prev => prev + acornGain);
        setToast({ text, acornGain });
        setTimeout(() => setToast(null), 3500);
      };

      // --- 初回ロード ---
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.studentName !== undefined) setStudentName(parsed.studentName);
            if (Array.isArray(parsed.tests)) setTests(parsed.tests);
            if (Array.isArray(parsed.schools)) setSchools(parsed.schools);
            if (Array.isArray(parsed.flashcards)) setFlashcards(parsed.flashcards);
            if (typeof parsed.acorns === 'number') setAcorns(parsed.acorns);
            if (Array.isArray(parsed.solvedQuestionIds)) setSolvedQuestionIds(parsed.solvedQuestionIds);
            if (Array.isArray(parsed.studyLogs)) setStudyLogs(parsed.studyLogs);
            if (parsed.customApiKey) setCustomApiKey(parsed.customApiKey);
          }
        } catch (e) {
          console.error('Failed to load state', e);
        }
      }, []);

      // --- 自動保存 ---
      useEffect(() => {
        try {
          const dataToSave = {
            studentName,
            tests,
            schools,
            flashcards,
            acorns,
            solvedQuestionIds,
            studyLogs,
            customApiKey
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        } catch (e) {
          console.error('Failed to save state', e);
        }
      }, [studentName, tests, schools, flashcards, acorns, solvedQuestionIds, studyLogs, customApiKey]);

      // --- このアプリ自体を単体HTMLファイルとしてダウンロードする関数 ---
      // （Geminiの枠を出て、全画面＆Googleログイン不要で使うための機能）
      const downloadStandaloneApp = () => {
        try {
          const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('GitHubアップロード用の「index.html」をダウンロードしました！', 0);
        } catch (e) {
          showToast('ダウンロードに失敗しました', 0);
        }
      };

      // --- テスト追加フォーム用ステート ---
      const [uploadForm, setUploadForm] = useState({
        name: '',
        type: '組分けテスト',
        date: new Date().toISOString().split('T')[0],
        course: '',
        scores: {
          算数: { score: '', maxScore: 200, deviation: '' },
          国語: { score: '', maxScore: 150, deviation: '' },
          理科: { score: '', maxScore: 100, deviation: '' },
          社会: { score: '', maxScore: 100, deviation: '' },
          四科: { score: '', maxScore: 550, deviation: '' }
        },
        files: { answerSheet: null, explanation: null, accuracySheet: null },
        questions: [
          { id: 'q-init-1', subject: '算数', number: '大問2(1)', unit: '和差算', isCorrect: false, accuracyRate: 55, questionSummary: '' }
        ]
      });
      const [isScanningFiles, setIsScanningFiles] = useState(false);

      // --- AI道場ステート ---
      const [activeQuestion, setActiveQuestion] = useState(null);
      const [userAnswerInput, setUserAnswerInput] = useState('');
      const [answerFeedback, setAnswerFeedback] = useState(null);
      const [hintLevel, setHintLevel] = useState(0);
      const [showFullExplanation, setShowFullExplanation] = useState(false);
      const [aiGeneratedContent, setAiGeneratedContent] = useState(null);
      const [isGeneratingAi, setIsGeneratingAi] = useState(false);

      // --- 暗記カードステート ---
      const [cardSubjectFilter, setCardSubjectFilter] = useState('すべて');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isCardFlipped, setIsCardFlipped] = useState(false);
      const [newCardForm, setNewCardForm] = useState({ subject: '理科', unit: '', front: '', back: '' });

      // --- データ同期コード用 ---
      const [backupCodeInput, setBackupCodeInput] = useState('');

      const handleTestTypeChange = (type) => {
        let defaultMax = { 算数: 200, 国語: 150, 理科: 100, 社会: 100, 四科: 550 };
        if (type === 'カリキュラムテスト') {
          defaultMax = { 算数: 100, 国語: 100, 理科: 50, 社会: 50, 四科: 300 };
        } else if (type === '全統小') {
          defaultMax = { 算数: 150, 国語: 150, 理科: 100, 社会: 100, 四科: 500 };
        }
        setUploadForm(prev => ({
          ...prev,
          type,
          scores: {
            算数: { ...prev.scores.算数, maxScore: defaultMax.算数 },
            国語: { ...prev.scores.国語, maxScore: defaultMax.国語 },
            理科: { ...prev.scores.理科, maxScore: defaultMax.理科 },
            社会: { ...prev.scores.社会, maxScore: defaultMax.社会 },
            四科: { ...prev.scores.四科, maxScore: defaultMax.四科 }
          }
        }));
      };

      const chartData = useMemo(() => {
        return tests
          .filter(t => includeCurriculum || t.type !== 'カリキュラムテスト')
          .sort((a, b) => new Date(a.date) - new Date(b.date))
          .map(t => {
            const sub = t.subjects[chartSubject] || t.subjects['四科'];
            const scorePct = sub.maxScore ? Math.round((sub.score / sub.maxScore) * 100) : 0;
            return {
              name: t.name,
              date: t.date,
              type: t.type,
              course: t.course,
              deviation: Number(sub.deviation) || 0,
              score: Number(sub.score) || 0,
              maxScore: Number(sub.maxScore) || 100,
              scorePercentage: scorePct
            };
          });
      }, [tests, includeCurriculum, chartSubject]);

      const validSchools = useMemo(() => {
        return schools.filter(s => s.name.trim() !== '' && Number(s.targetDeviation) > 0);
      }, [schools]);

      const latestDeviation = useMemo(() => {
        if (chartData.length === 0) return null;
        return chartData[chartData.length - 1].deviation;
      }, [chartData]);

      const allQuestions = useMemo(() => {
        const list = [];
        tests.forEach(t => {
          (t.questions || []).forEach(q => {
            list.push({
              ...q,
              testName: t.name,
              testType: t.type,
              testDate: t.date,
              isSolved: solvedQuestionIds.includes(q.id)
            });
          });
        });
        return list;
      }, [tests, solvedQuestionIds]);

      const unitStatsMap = useMemo(() => {
        const map = {};
        allQuestions.forEach(q => {
          const key = `${q.subject}:${q.unit}`;
          if (!map[key]) {
            map[key] = { subject: q.subject, unit: q.unit, total: 0, correct: 0, missedHighAcc: 0, questions: [] };
          }
          map[key].total += 1;
          if (q.isCorrect || q.isSolved) {
            map[key].correct += 1;
          } else if (q.accuracyRate >= accuracyThreshold) {
            map[key].missedHighAcc += 1;
          }
          map[key].questions.push(q);
        });
        return map;
      }, [allQuestions, accuracyThreshold]);

      const handleFileSelect = (key, e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64String = typeof reader.result === 'string' ? reader.result.split(',')[1] : '';
          setUploadForm(prev => ({
            ...prev,
            files: {
              ...prev.files,
              [key]: {
                name: file.name,
                size: (file.size / 1024).toFixed(1) + ' KB',
                mimeType: file.type,
                base64: file.type.startsWith('image/') ? base64String : null
              }
            }
          }));
          showToast(`「${file.name}」を選択しました`, 5);
        };
        reader.readAsDataURL(file);
      };

      const handleAiScanFiles = async () => {
        setIsScanningFiles(true);
        const apiKey = customApiKey.trim() || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        try {
          const parts = [
            {
              text: `中学受験（小学4年生・四谷大塚など）のテスト答案・解説・正答率表から、テスト問題データを4問抽出または作成してください。
テスト種別: ${uploadForm.type}
科目は算数・国語・理科・社会を含めてください。`
            }
          ];
          if (uploadForm.files.answerSheet?.base64) {
            parts.push({
              inlineData: {
                mimeType: uploadForm.files.answerSheet.mimeType || "image/png",
                data: uploadForm.files.answerSheet.base64
              }
            });
          }

          const payload = {
            contents: [{ role: "user", parts }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  suggestedName: { type: "STRING" },
                  questions: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        subject: { type: "STRING" },
                        number: { type: "STRING" },
                        unit: { type: "STRING" },
                        isCorrect: { type: "BOOLEAN" },
                        accuracyRate: { type: "NUMBER" },
                        questionSummary: { type: "STRING" }
                      }
                    }
                  }
                }
              }
            }
          };

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const parsed = JSON.parse(data?.candidates?.[0]?.content?.parts?.[0]?.text || "{}");

          if (parsed.questions && parsed.questions.length > 0) {
            setUploadForm(prev => ({
              ...prev,
              name: prev.name || parsed.suggestedName || `第1回 ${prev.type}`,
              questions: parsed.questions.map((q, idx) => ({
                id: `scan-${Date.now()}-${idx}`,
                subject: ['算数', '国語', '理科', '社会'].includes(q.subject) ? q.subject : '算数',
                number: q.number || `大問${idx + 1}(1)`,
                unit: q.unit || '整数・小数の計算',
                isCorrect: Boolean(q.isCorrect),
                accuracyRate: Number(q.accuracyRate) || 55,
                questionSummary: q.questionSummary || 'テスト問題の要点'
              }))
            }));
            showToast('ファイルから問題と単元を読み取りました！', 15);
          } else {
            throw new Error('Fallback');
          }
        } catch (e) {
          setUploadForm(prev => ({
            ...prev,
            name: prev.name || `第1回 ${prev.type}`,
            questions: [
              { id: `scan-${Date.now()}-1`, subject: '算数', number: '大問2(2)', unit: '和差算', isCorrect: false, accuracyRate: 58, questionSummary: '2人の持っている金額の和と差からそれぞれの金額を求める問題' },
              { id: `scan-${Date.now()}-2`, subject: '算数', number: '大問4(1)', unit: '植木算', isCorrect: false, accuracyRate: 42, questionSummary: '木と木の間の長さと本数から全体の距離を求める問題' },
              { id: `scan-${Date.now()}-3`, subject: '算数', number: '大問5(2)', unit: '角度', isCorrect: true, accuracyRate: 65, questionSummary: '平行線と折り返した図形の角度を求める問題' },
              { id: `scan-${Date.now()}-4`, subject: '理科', number: '大問3 問2', unit: '磁石の性質', isCorrect: false, accuracyRate: 35, questionSummary: '電磁石の導線の巻き数と方位磁針の振れ方の問題' }
            ]
          }));
          showToast('テスト問題の入力テンプレートをセットしました！必要に応じて修正してください。', 10);
        } finally {
          setIsScanningFiles(false);
        }
      };

      const handleSaveTest = (e) => {
        e.preventDefault();
        const s = uploadForm.scores;
        const sumScore =
          (Number(s.算数.score) || 0) +
          (Number(s.国語.score) || 0) +
          (Number(s.理科.score) || 0) +
          (Number(s.社会.score) || 0);

        const validDevs = ['算数', '国語', '理科', '社会']
          .map(k => Number(s[k].deviation))
          .filter(v => v > 0);
        const avgDev = validDevs.length > 0
          ? Number((validDevs.reduce((a, b) => a + b, 0) / validDevs.length).toFixed(1))
          : 50.0;

        const newTest = {
          id: `test-${Date.now()}`,
          name: uploadForm.name.trim() || `${uploadForm.type} (${uploadForm.date})`,
          type: uploadForm.type,
          date: uploadForm.date,
          course: uploadForm.course.trim() || '標準',
          files: uploadForm.files,
          subjects: {
            算数: { score: Number(s.算数.score) || 0, maxScore: Number(s.算数.maxScore), deviation: Number(s.算数.deviation) || 50 },
            国語: { score: Number(s.国語.score) || 0, maxScore: Number(s.国語.maxScore), deviation: Number(s.国語.deviation) || 50 },
            理科: { score: Number(s.理科.score) || 0, maxScore: Number(s.理科.maxScore), deviation: Number(s.理科.deviation) || 50 },
            社会: { score: Number(s.社会.score) || 0, maxScore: Number(s.社会.maxScore), deviation: Number(s.社会.deviation) || 50 },
            四科: {
              score: Number(s.四科.score) || sumScore,
              maxScore: Number(s.四科.maxScore),
              deviation: Number(s.四科.deviation) || avgDev
            }
          },
          questions: uploadForm.questions
            .filter(q => q.unit.trim() !== '' || q.questionSummary.trim() !== '')
            .map((q, idx) => ({
              ...q,
              id: `q-${Date.now()}-${idx}`,
              unit: q.unit.trim() || '基本単元',
              questionSummary: q.questionSummary.trim() || `${q.subject} ${q.number}の問題`,
              accuracyRate: Number(q.accuracyRate) || 50
            }))
        };

        setTests(prev => [...prev, newTest]);
        setStudyLogs(prev => [
          { id: `log-${Date.now()}`, date: new Date().toLocaleDateString('ja-JP'), title: `テスト登録：${newTest.name}` },
          ...prev
        ]);

        setUploadForm(prev => ({
          ...prev,
          name: '',
          scores: {
            算数: { ...prev.scores.算数, score: '', deviation: '' },
            国語: { ...prev.scores.国語, score: '', deviation: '' },
            理科: { ...prev.scores.理科, score: '', deviation: '' },
            社会: { ...prev.scores.社会, score: '', deviation: '' },
            四科: { ...prev.scores.四科, score: '', deviation: '' }
          },
          files: { answerSheet: null, explanation: null, accuracySheet: null },
          questions: [
            { id: `q-init-${Date.now()}`, subject: '算数', number: '大問2(1)', unit: '', isCorrect: false, accuracyRate: 50, questionSummary: '' }
          ]
        }));

        showToast(`「${newTest.name}」を登録しました！どんぐり+30個`, 30);
        setActiveView('home');
      };

      const startDojoExercise = async (question, mode) => {
        setActiveQuestion({ ...question, mode });
        setUserAnswerInput('');
        setAnswerFeedback(null);
        setHintLevel(0);
        setShowFullExplanation(false);
        setIsGeneratingAi(true);
        setAiGeneratedContent(null);
        setActiveView('dojo');

        const isReview = mode === 'review';
        const systemPrompt = `あなたは中学受験を目指す小学4年生に寄り添う、優しくてわかりやすい「パーソナルコーチ（もちくま先生）」です。落ち着いた丁寧なトーンで、段階的なヒントと詳しい解説、良質な類題・応用問題を作成してください。`;

        const userPrompt = isReview
          ? `以下のテストで間違えた問題について、解き直しのための「類似問題（類題）」と「2段階のヒント」「詳しい解き方・解説」を作成してください。
科目: ${question.subject} / 単元: ${question.unit} / 正答率: ${question.accuracyRate}% / 内容: ${question.questionSummary}`
          : `以下のテストで正解できた得意な問題について、さらに実力を伸ばす「応用問題」と「2段階のヒント」「詳しい解き方・解説」を作成してください。
科目: ${question.subject} / 単元: ${question.unit} / 正答率: ${question.accuracyRate}% / 内容: ${question.questionSummary}`;

        const payload = {
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                problemText: { type: "STRING" },
                expectedAnswer: { type: "STRING" },
                hint1: { type: "STRING" },
                hint2: { type: "STRING" },
                stepExplanation: { type: "ARRAY", items: { type: "STRING" } },
                coachComment: { type: "STRING" }
              }
            }
          }
        };

        const apiKey = customApiKey.trim() || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            setAiGeneratedContent(JSON.parse(text));
          } else {
            throw new Error('Fallback');
          }
        } catch (e) {
          if (question.subject === '算数') {
            setAiGeneratedContent({
              problemText: isReview
                ? `【類題演習】AさんとBさんが同じ金額を出し合って、クッキーを24枚買いました。買った後でAさんがBさんより6枚多くもらうことになり、もらった枚数分だけお金を出すことにしたので、AさんはBさんに150円渡しました。クッキー1枚の値段は何円ですか。（元の問題：${question.questionSummary}）`
                : `【応用演習】Aさん、Bさん、Cさんの3人が同じ金額を出し合ってノートを36冊買いました。分けるときにAさんとBさんはCさんより3冊ずつ多くもらったため、AさんとBさんはCさんにそれぞれ120円ずつ渡しました。ノート1冊の値段は何円ですか。`,
              expectedAnswer: isReview ? '50' : '40',
              hint1: `まず、それぞれが何枚（何冊）もらったかを「和差算」や線分図を使って求めましょう。はじめは同じ金額を出したので、「平均の枚数」のお金を出したことになります。`,
              hint2: isReview
                ? `24枚を2人で同じ数ずつ分けると1人12枚です。Aさんは(24+6)÷2＝15枚もらったので、予定より「3枚分」多くもらい、その代金が150円にあたります。`
                : `36冊を3人で同じ数ずつ分けると1人12冊です。Cさんは何冊もらったか求めて、予定の12冊との差を考えましょう。`,
              stepExplanation: isReview
                ? [
                    'ステップ1：AさんとBさんが実際にもらった枚数を和差算で求めます。Aさんは (24＋6)÷2＝15枚、Bさんは 24－15＝9枚 です。',
                    'ステップ2：最初は2人とも同じ金額（24÷2＝12枚分）を出していました。',
                    'ステップ3：Aさんは12枚より 15－12＝3枚 多くもらったため、Bさんに150円渡しました。よってクッキー1枚は 150÷3＝50円 です。'
                  ]
                : [
                    'ステップ1：36冊を同じ数ずつ分けると 36÷3＝12冊ずつです。',
                    'ステップ2：AさんとBさんがCさんより3冊ずつ多いので、Cさんは (36－3×2)÷3＝10冊 もらいました。',
                    'ステップ3：Cさんは12冊分の代金を払って10冊しかもらわなかったので、2冊分のお金（120×2＝240円）を返してもらいました。よって1冊 240÷6＝40円 です。'
                  ],
              coachComment: `「${question.unit}」は線分図を描いて整理するとグッと解きやすくなるよ！`
            });
          } else {
            setAiGeneratedContent({
              problemText: isReview
                ? `【${question.unit}・類題】「${question.questionSummary}」に関する基本確認問題です。問題文の条件やキーワードに注目して、自分の言葉や知識で答えをまとめてみましょう。`
                : `【${question.unit}・応用】「${question.questionSummary}」から一歩進んだ入試レベルの応用問題です。「なぜそうなるのか」の理由も含めて答えを考えてみましょう。`,
              expectedAnswer: '解説の重要ポイントを確認',
              hint1: `まずは「${question.unit}」の基本用語や、問題文に出てくる変化のきっかけに線を引いてみましょう。`,
              hint2: `変化する前と後の「ちがい」を比べてみると、答えの根拠が見つかります。`,
              stepExplanation: [
                `ステップ1：問題で聞かれていること（「理由」「名称」「記号」など）の文末を確かめます。`,
                `ステップ2：「${question.unit}」の重要ポイントを思い出し、条件と照らし合わせます。`,
                `ステップ3：抜け漏れがないか確認して答えを完成させましょう。`
              ],
              coachComment: `正答率${question.accuracyRate}%の問題にしっかり向き合えてえらいね！`
            });
          }
        } finally {
          setIsGeneratingAi(false);
        }
      };

      const coachStage = useMemo(() => {
        if (acorns < 50) return { level: 1, title: 'ふたばコーチ', badge: '🌱', next: 50, desc: 'テストの登録や解き直しで「どんぐり」が集まるよ！' };
        if (acorns < 150) return { level: 2, title: 'わかばコーチ', badge: '🌿', next: 150, desc: 'いいペース！コツコツ復習する習慣がついてきたね。' };
        if (acorns < 300) return { level: 3, title: 'みのりの木コーチ', badge: '🌳', next: 300, desc: '苦手な単元が少しずつ得意に変わってきているよ！' };
        return { level: 4, title: '大樹のマスターコーチ', badge: '👑🌳', next: 500, desc: '2年間の積み重ねが大きな力になっているよ！' };
      }, [acorns]);

      const copyToClipboard = (text, successMsg) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(successMsg, 0);
        } catch (err) {
          showToast('コピーに失敗しました', 0);
        }
        document.body.removeChild(textarea);
      };

      const exportBackupCode = () => {
        const payload = { studentName, tests, schools, flashcards, acorns, solvedQuestionIds, studyLogs };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        copyToClipboard(encoded, 'iPad引き継ぎ用データコードをコピーしました！');
      };

      const importBackupCode = () => {
        if (!backupCodeInput.trim()) return;
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(backupCodeInput.trim()))));
          if (decoded.tests) setTests(decoded.tests);
          if (decoded.schools) setSchools(decoded.schools);
          if (decoded.flashcards) setFlashcards(decoded.flashcards);
          if (decoded.studentName !== undefined) setStudentName(decoded.studentName);
          if (typeof decoded.acorns === 'number') setAcorns(decoded.acorns);
          if (Array.isArray(decoded.solvedQuestionIds)) setSolvedQuestionIds(decoded.solvedQuestionIds);
          setBackupCodeInput('');
          showToast('データを復元・同期しました！', 0);
          setActiveView('home');
        } catch (e) {
          showToast('データコードの形式が正しくありません。', 0);
        }
      };

      const filteredCards = useMemo(() => {
        return flashcards.filter(c => cardSubjectFilter === 'すべて' || c.subject === cardSubjectFilter);
      }, [flashcards, cardSubjectFilter]);

      return (
        <div className="min-h-screen bg-[#F3EFE6] text-[#3D352E] pb-20">
          {/* トースト通知 */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-[#FFFDF9] border-2 border-[#4B8364] shadow-lg rounded-2xl px-5 py-3.5 flex items-center gap-3 animate-bounce">
              <MochiKumaIcon size={36} />
              <div>
                <p className="font-bold text-sm text-[#3D352E]">{toast.text}</p>
                {toast.acornGain > 0 && (
                  <p className="text-xs font-bold text-[#4B8364]">🌰 どんぐり +{toast.acornGain}個 獲得！</p>
                )}
              </div>
            </div>
          )}

          {/* ヘッダー */}
          <header className="bg-[#E6D5B8] border-b border-[#D8C5A5] sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              <div
                onClick={() => setActiveView('home')}
                className="cursor-pointer flex items-center gap-2.5"
              >
                {activeView !== 'home' && (
                  <span className="bg-[#FFFDF9] text-[#5C5248] px-3 py-1 rounded-xl text-xs font-bold border border-[#D8C5A5] hover:bg-[#F5EFE6] transition">
                    ← もどる
                  </span>
                )}
                <h1 className="text-lg md:text-xl font-extrabold tracking-tight text-[#3D352E]">
                  中学受験 伴走ナビ
                </h1>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setActiveView('share')}
                  className="bg-[#4B8364] hover:bg-[#3B6E52] text-white px-3.5 py-1.5 rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition"
                >
                  <span>📱 全画面化・iPad共有</span>
                </button>

                <div
                  onClick={() => setActiveView('records')}
                  className="cursor-pointer bg-[#FFFDF9] border border-[#D4C3A3] px-3 py-1 rounded-2xl flex items-center gap-2 shadow-sm hover:bg-[#FAF6F0] transition"
                >
                  <MochiKumaIcon size={28} />
                  <div className="text-left">
                    <p className="text-[10px] font-bold text-[#7A6F63] leading-none">パーソナルコーチ</p>
                    <p className="text-xs font-extrabold text-[#3D352E]">
                      Lv.{coachStage.level} <span className="text-[#4B8364]">🌰{acorns}</span>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* メインコンテンツ（iPad横向き・PCでも広々使える max-w-7xl） */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-5">
            {/* ==================== 1. ホーム画面 ==================== */}
            {activeView === 'home' && (
              <div className="space-y-6">
                {/* 挨拶バナー */}
                <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-4 sm:p-5 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <MochiKumaIcon size={58} className="shrink-0" />
                    <div>
                      <div className="flex flex-wrap items-center gap-2">
                        <input
                          type="text"
                          placeholder="お名前を入力"
                          value={studentName}
                          onChange={e => setStudentName(e.target.value)}
                          className="bg-[#F3EFE6] border border-[#D8C5A5] rounded-xl px-3 py-1 text-base sm:text-lg font-extrabold text-[#3D352E] w-36 focus:outline-none focus:border-[#4B8364]"
                        />
                        <span className="text-base sm:text-xl font-extrabold text-[#3D352E]">
                          ちゃん、こんにちは！今日も一歩一歩ずつ進めよう！
                        </span>
                      </div>
                      <p className="text-xs sm:text-sm text-[#7A6F63] mt-1">
                        {tests.length === 0
                          ? '最初はデータが何も入っていません。テスト結果や目標の志望校を1つずつ登録していこう！'
                          : `現在 ${tests.length} 回のテストを記録中。正答率${accuracyThreshold}%以上の問題から優先して復習しよう！`}

                      <div

                      >
                        <div className="flex items-center gap-4 text-[#7A6F63]">

                            <p className="text-[10px] font-bold">答案・解説PDF</p>

                          <span className="text-[#4B8364] font-extrabold">➔</span>
                          <div className="bg-white border-2 border-[#5C5248] px-3 py-2 rounded-xl shadow-sm text-center">
                            <span className="text-xl">📱</span>
                            <p className="text-[10px] font-bold">iPadで分析</p>

                      </div>
                    </div>

                    {/* カード2：成績＆志望校 グラフ */}
                    <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <h2 className="text-base sm:text-lg font-extrabold text-[#3D352E] flex items-center gap-2">
                          <span>📈</span> 成績＆志望校 グラフ
                        </h2>

                        <div className="flex gap-1 bg-[#F3EFE6] p-1 rounded-xl">

                    onClick={() => {
                      if (!newCardForm.front.trim() || !newCardForm.back.trim()) return;
                      setFlashcards(prev => [...prev, { id: `fc-${Date.now()}`, ...newCardForm }]);
                      setNewCardForm({ ...newCardForm, front: '', back: '' });
                      showToast('カードを追加しました！+10🌰', 10);
                    }}
                    className="w-full bg-[#4B8364] text-white font-extrabold py-3 rounded-full text-xs sm:text-sm"
                  >
                    カードを追加する（+10🌰）
                  </button>
                </div>
              </div>
            )}

            {/* ==================== 6. 志望校の設定 ==================== */}
            {activeView === 'schools' && (
              <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-5 sm:p-7 shadow-sm space-y-6">
                <h2 className="text-xl font-extrabold text-[#3D352E]">🏫 志望校の設定（最大5校）</h2>
                <div className="space-y-3">
                  {schools.map((school, idx) => (
                    <div key={school.id} className="p-4 rounded-2xl bg-[#F9F6F0] border border-[#E2D9C8] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div className="flex items-center gap-3 flex-1">
                        <span className="w-7 h-7 rounded-full text-white font-extrabold text-xs flex items-center justify-center shrink-0" style={{ backgroundColor: school.color }}>{idx + 1}</span>
                        <input
                          type="text"
                          placeholder={`第${idx + 1}志望の学校名を入力`}
                          value={school.name}
                          onChange={e => { const next = [...schools]; next[idx].name = e.target.value; setSchools(next); }}
                          className="w-full bg-white rounded-xl border border-[#D8C5A5] px-3.5 py-2 text-sm font-bold"
                        />
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold text-[#5C5248]">目標偏差値:</span>
                        <input
                          type="number"
                          placeholder="例: 60"
                          value={school.targetDeviation}
                          onChange={e => { const next = [...schools]; next[idx].targetDeviation = e.target.value; setSchools(next); }}
                          className="w-24 bg-white rounded-xl border border-[#D8C5A5] px-3 py-2 text-sm font-extrabold text-center text-[#4B8364]"
                        />
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex justify-end">
                  <button onClick={() => { showToast('志望校を保存しました！', 5); setActiveView('home'); }} className="bg-[#4B8364] text-white font-extrabold px-6 py-3 rounded-full text-sm">
                    保存してホームへもどる
                  </button>
                </div>
              </div>
            )}

            {/* ==================== 7. おたのしみ（学習のきろく） ==================== */}
            {activeView === 'records' && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-6 shadow-sm flex flex-col items-center text-center space-y-4">
                  <MochiKumaIcon size={88} />
                  <h3 className="text-xl font-extrabold text-[#3D352E]">{coachStage.badge} {coachStage.title} (Lv.{coachStage.level})</h3>
                  <p className="text-xs sm:text-sm text-[#5C5248]">{coachStage.desc}</p>
                  <div className="w-full bg-[#F9F6F0] p-4 rounded-2xl border border-[#E2D9C8]">
                    <p className="text-xs font-bold text-[#5C5248] mb-1">集めたどんぐり: 🌰 {acorns} / {coachStage.next}</p>
                    <div className="w-full h-3 bg-[#E5DEC9] rounded-full overflow-hidden">
                      <div className="h-full bg-[#4B8364]" style={{ width: `${Math.min(100, Math.round((acorns / coachStage.next) * 100))}%` }} />
                    </div>
                  </div>
                </div>
                <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-6 shadow-sm space-y-4">
                  <h3 className="text-base font-extrabold text-[#3D352E]">📅 これまでの学習のきろく</h3>
                  {studyLogs.length === 0 ? (
                    <p className="text-xs font-bold text-[#7A6F63]">まだ記録がありません。</p>
                  ) : (
                    <div className="space-y-2">
                      {studyLogs.map(log => (
                        <div key={log.id} className="p-3 rounded-xl bg-[#FAF8F4] border border-[#EAE3D5] flex justify-between text-xs font-bold">
                          <span>{log.title}</span>
                          <span className="text-[#7A6F63]">{log.date}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ==================== 8. 全画面化・Googleログイン不要化・iPad共有ガイド ==================== */}
            {activeView === 'share' && (
              <div className="bg-[#FFFDF9] border border-[#E2D9C8] rounded-3xl p-5 sm:p-7 shadow-sm space-y-6">
                <div>
                  <h2 className="text-xl font-extrabold text-[#3D352E]">
                    📱 Geminiの枠を外して「全画面＆Googleログイン不要」でiPadで使う方法
                  </h2>
                  <p className="text-xs sm:text-sm text-[#7A6F63] mt-1">
                    このアプリは1つのHTMLファイル（<code>index.html</code>）の中にすべての機能が詰まっているため、Geminiの外に取り出して100%全画面で使うことができます。
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* 解決策1：単体HTMLダウンロード ＆ 無料ホスティング */}
                  <div className="bg-[#F9F6F0] border-2 border-[#4B8364] rounded-2xl p-5 space-y-3">
                    <span className="bg-[#4B8364] text-white text-xs font-extrabold px-3 py-1 rounded-full">
                      一番おすすめ！全画面＆ログイン不要にする手順
                    </span>
                    <h3 className="text-sm sm:text-base font-extrabold text-[#3D352E]">
                      1. 単体アプリファイル（HTML）をダウンロードする
                    </h3>
                    <p className="text-xs text-[#5C5248] leading-relaxed">
                      下のボタンを押すと、Geminiの枠を含まない<strong>純粋なアプリファイル（1ファイル）</strong>がダウンロードされます。
                    </p>
                    <button
                      type="button"
                      onClick={downloadStandaloneApp}
                      className="w-full bg-[#4B8364] hover:bg-[#3B6E52] text-white font-extrabold text-xs sm:text-sm py-3 px-4 rounded-xl shadow-sm transition"
                    >
                      ⬇️ GitHub公開用のファイル (index.html) をダウンロード
                    </button>
                    <div className="text-xs text-[#5C5248] space-y-2 pt-2 border-t border-[#E2D9C8] leading-relaxed">
                      <p className="font-extrabold text-[#3D352E]">🐙 GitHubで専用URLを作る手順（5分で完了）：</p>
                      <ol className="list-decimal list-inside space-y-1">
                        <li>上のボタンで <strong><code>index.html</code></strong> をパソコン（またはiPad）に保存します。</li>
                        <li>GitHub右上の「<strong>＋</strong>」➔「<strong>New repository</strong>」をクリックします。</li>
                        <li>Repository nameに好きな英語名（例: <code>juken-navi</code>）を入れ、<strong>Public</strong>を選んで「<strong>Create repository</strong>」を押します。</li>
                        <li>画面内の「<strong>uploading an existing file</strong>」という青い文字を押し、先ほどの <code>index.html</code> を入れて緑色の「<strong>Commit changes</strong>」を押します。</li>
                        <li>上部メニュー「<strong>Settings</strong>」➔左メニュー「<strong>Pages</strong>」を開き、Branchの「None」を「<strong>main</strong>」に変えて「<strong>Save</strong>」を押せば、1〜2分後に専用URLが発行されます！</li>
                      </ol>
                    </div>
                  </div>

                  {/* 解決策2：データ引き継ぎ＆APIキー設定 */}
                  <div className="bg-[#F9F6F0] border border-[#E2D9C8] rounded-2xl p-5 space-y-4">
                    <h3 className="text-sm sm:text-base font-extrabold text-[#3D352E]">
                      🔄 親のPC/スマホ ⇄ 子どものiPad データ引き継ぎ
                    </h3>
                    <p className="text-xs text-[#5C5248] leading-relaxed">
                      親御様が入力したテスト結果や志望校データを、お子様のiPadへワンタップでコピー＆ペーストして同期できます。
                    </p>
                    <button
                      type="button"
                      onClick={exportBackupCode}
                      className="bg-white hover:bg-[#EFEAE0] text-[#2C5840] border border-[#4B8364] font-extrabold text-xs px-4 py-2.5 rounded-xl"
                    >
                      📋 現在のデータ引き継ぎコードをコピー
                    </button>

                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="引き継ぎコードをここに貼り付け"
                        value={backupCodeInput}
                        onChange={e => setBackupCodeInput(e.target.value)}
                        className="flex-1 bg-white rounded-xl border border-[#D8C5A5] px-3 py-2 text-xs"
                      />
                      <button
                        type="button"
                        onClick={importBackupCode}
                        className="bg-[#547AA5] text-white font-bold text-xs px-4 py-2 rounded-xl shrink-0"
                      >
                        読み込む
                      </button>
                    </div>

                    <div className="pt-3 border-t border-[#E2D9C8] space-y-1.5">
                      <label className="block text-xs font-bold text-[#5C5248]">
                        🔑 外部サイト利用時のGemini APIキー設定（任意）
                      </label>
                      <input
                        type="password"
                        placeholder="AI自動生成を使う場合のみ入力（未入力でも標準問題が動きます）"
                        value={customApiKey}
                        onChange={e => setCustomApiKey(e.target.value)}
                        className="w-full bg-white rounded-xl border border-[#D8C5A5] px-3 py-2 text-xs"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
