<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>中学受験 伴走ナビ - パーソナルコーチ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F3EFE6;
      color: #3D352E;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #D8C5A5; border-radius: 9999px; }
    .btn-press:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="min-h-screen"></div>
  <div id="toast-container" class="fixed top-5 right-5 z-50 pointer-events-none"></div>
  <script id="main-app-script">
    // GitHub本番ドメイン(github.io)で開かれた場合は上部の書き出しバーを自動で隠す
    if (window.location.hostname.includes('github.io')) {
      const bar = document.getElementById('github-export-bar');
      if (bar) bar.style.display = 'none';
    }

    const STORAGE_KEY = 'chugaku_juken_bansou_navi_v3';
    const GRADE_OPTIONS = ['4年', '5年', '6年'];
    const COURSE_OPTIONS = ['Aクラス', 'Bクラス', 'C（SS）クラス', 'NNクラス'];
    const SCHOOL_COLORS = ['#4B8364', '#C86D65', '#D49B35', '#547AA5', '#8C659C'];

    const SUBJECT_STYLES = {
      四科: { bg: 'bg-[#E6EFE9]', text: 'text-[#3B6E52]', border: 'border-[#B8D4C4]', hex: '#4B8364' },
      算数: { bg: 'bg-[#E6EFE9]', text: 'text-[#3B6E52]', border: 'border-[#B8D4C4]', hex: '#4B8364' },
      国語: { bg: 'bg-[#F5E6E4]', text: 'text-[#A64B44]', border: 'border-[#E2BBBB]', hex: '#C86D65' },
      理科: { bg: 'bg-[#FDF3DC]', text: 'text-[#9C711C]', border: 'border-[#EED59A]', hex: '#D49B35' },
      社会: { bg: 'bg-[#E8EEF5]', text: 'text-[#3E5F8A]', border: 'border-[#C2D4E8]', hex: '#547AA5' }
    };

    const CURRICULUM_MAP = {
      算数: [
        { category: '数と計算', units: ['整数・小数の計算', '単位の換算', '分数の計算', '還元算(□を求める)', 'およその数（概数）'] },
        { category: '文章題（特殊算）', units: ['和差算', '植木算', '分配算', 'つるかめ算', '消去算', '過不足算・差集め算'] },
        { category: '数の性質・規則性', units: ['約数と倍数', 'あまりと整数の問題', '周期算', '等差数列', '方陣算'] },
        { category: '平面・立体図形', units: ['角度', '正方形と長方形の面積', '三角形と四角形の面積', '円とおうぎ形', '直方体と立方体'] }
      ],
      国語: [
        { category: '漢字・知識', units: ['漢字の読み書き', '四字熟語・ことわざ', '慣用句', '敬語・文法', '同音異義語・類義語'] },
        { category: '物語・小説文', units: ['登場人物の心情理解', '場面の移り変わり', '行動の理由説明', '主題の把握'] },
        { category: '説明・論説文', units: ['接続語・指示語', '段落の役割と構成', '筆者の主張・要旨', '抜き出し・要約記述'] }
      ],
      理科: [
        { category: '生物と環境', units: ['春の生物', '夏の生物', '昆虫のからだ', '植物のつくりと成長', 'ヒトのからだ'] },
        { category: '物質とエネルギー', units: ['磁石の性質', '乾電池と豆電球', '光と鏡の性質', '空気と水の性質', 'ものの温度と体積'] },
        { category: '地球と宇宙', units: ['星座と星の動き', '月の満ち欠け', '天気と気温の変化', '流れる水のはたらき'] }
      ],
      社会: [
        { category: '日本の地理（基礎）', units: ['都道府県と県庁所在地', '地図記号と縮尺', '日本の地形・川・平野', '日本の気候区分'] },
        { category: 'くらしと産業', units: ['日本の農業（米・野菜）', '水産業と漁港', 'ゴミ処理とリサイクル', '上水道と電力・防災'] },
        { category: '地方別の特色', units: ['九州地方', '中国・四国地方', '近畿地方', '中部・関東・東北・北海道'] }
      ]
    };

    function renderMochiKumaSvg(size = 48) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <circle cx="26" cy="28" r="12" fill="#E3B788" />
          <circle cx="26" cy="28" r="6" fill="#F4D7B6" />
          <circle cx="74" cy="28" r="12" fill="#E3B788" />
          <circle cx="74" cy="28" r="6" fill="#F4D7B6" />
          <path d="M50 18 C48 8, 36 8, 40 16 C43 20, 48 19, 50 18 Z" fill="#68A36E" />
          <path d="M50 18 C52 8, 64 8, 60 16 C57 20, 52 19, 50 18 Z" fill="#81B887" />
          <path d="M50 16 L50 23" stroke="#538558" stroke-width="2.5" stroke-linecap="round" />
          <rect x="18" y="22" width="64" height="62" rx="31" fill="#ECC59A" />
          <ellipse cx="50" cy="60" rx="22" ry="18" fill="#FFF7EB" />
          <ellipse cx="29" cy="52" rx="5" ry="3" fill="#F09C8B" opacity="0.7" />
          <ellipse cx="71" cy="52" rx="5" ry="3" fill="#F09C8B" opacity="0.7" />
          <path d="M34 45 Q38 40 42 45" stroke="#5C4433" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M58 45 Q62 40 66 45" stroke="#5C4433" stroke-width="3" stroke-linecap="round" fill="none" />
          <ellipse cx="50" cy="48" rx="3.5" ry="2.5" fill="#5C4433" />
          <path d="M46 52 Q50 56 54 52" stroke="#5C4433" stroke-width="2.5" stroke-linecap="round" fill="none" />
          <ellipse cx="22" cy="60" rx="6" ry="9" transform="rotate(-20 22 60)" fill="#E3B788" />
          <ellipse cx="78" cy="60" rx="6" ry="9" transform="rotate(20 78 60)" fill="#E3B788" />
          <ellipse cx="36" cy="84" rx="8" ry="5" fill="#D5A676" />
          <ellipse cx="64" cy="84" rx="8" ry="5" fill="#D5A676" />
        </svg>
      `;
    }

    let state = {
      isLocked: true,
      passcode: '1225',
      lockError: '',
      activeView: 'home',
      studentName: '',
      tests: [],
      schools: [
        { id: 's-1', name: '', targetDeviation: '', color: SCHOOL_COLORS[0] },
        { id: 's-2', name: '', targetDeviation: '', color: SCHOOL_COLORS[1] },
        { id: 's-3', name: '', targetDeviation: '', color: SCHOOL_COLORS[2] },
        { id: 's-4', name: '', targetDeviation: '', color: SCHOOL_COLORS[3] },
        { id: 's-5', name: '', targetDeviation: '', color: SCHOOL_COLORS[4] }
      ],
      flashcards: [],
      acorns: 0,
      solvedQuestionIds: [],
      studyLogs: [],
      selectedSubject: '算数',
      chartSubject: '四科',
      includeCurriculum: false,
      chartMetric: 'deviation',
      accuracyThreshold: 50,
      editingTestId: null,
      uploadForm: createInitialUploadForm(),
      activeDojo: null,
      cardSubjectFilter: 'すべて',
      currentCardIndex: 0,
      isCardFlipped: false
    };

    function createInitialUploadForm() {
      return {
        name: '',
        grade: '4年',
        type: '組分けテスト',
        date: new Date().toISOString().split('T')[0],
        course: 'Bクラス',
        scores: {
          算数: { score: '', maxScore: 200, deviation: '' },
          国語: { score: '', maxScore: 150, deviation: '' },
          理科: { score: '', maxScore: 100, deviation: '' },
          社会: { score: '', maxScore: 100, deviation: '' },
          四科: { score: '', maxScore: 550, deviation: '' }
        },
        files: {
          questionPapers: [],
          answerSheets: [],
          explanations: [],
          accuracySheets: []
        },
        questions: [
          { id: 'q-init-1', subject: '算数', number: '大問2(1)', unit: '和差算', isCorrect: false, accuracyRate: 55, questionSummary: '', wrongAnswerNote: '' }
        ]
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('chugaku_juken_bansou_navi_v2') || localStorage.getItem('chugaku_juken_bansou_navi_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.studentName !== undefined) state.studentName = parsed.studentName;
          if (Array.isArray(parsed.tests)) state.tests = parsed.tests;
          if (Array.isArray(parsed.schools)) state.schools = parsed.schools;
          if (Array.isArray(parsed.flashcards)) state.flashcards = parsed.flashcards;
          if (typeof parsed.acorns === 'number') state.acorns = parsed.acorns;
          if (Array.isArray(parsed.solvedQuestionIds)) state.solvedQuestionIds = parsed.solvedQuestionIds;
          if (Array.isArray(parsed.studyLogs)) state.studyLogs = parsed.studyLogs;
          if (parsed.passcode) state.passcode = parsed.passcode;
        }
        if (sessionStorage.getItem('juken_navi_unlocked') === 'true') {
          state.isLocked = false;
        }
      } catch (e) {
        console.error('Failed to load', e);
      }
    }

    function saveState() {
      try {
        const dataToSave = {
          studentName: state.studentName,
          tests: state.tests,
          schools: state.schools,
          flashcards: state.flashcards,
          acorns: state.acorns,
          solvedQuestionIds: state.solvedQuestionIds,
          studyLogs: state.studyLogs,
          passcode: state.passcode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
      } catch (e) {
        console.error('Failed to save', e);
      }
    }

    function showToast(text, acornGain = 0) {
      if (acornGain > 0) {
        state.acorns += acornGain;
        saveState();
      }
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'mb-3 bg-[#FFFDF9] border-2 border-[#4B8364] shadow-lg rounded-2xl px-5 py-3.5 flex items-center gap-3 transition-all transform duration-300 pointer-events-auto';
      toast.innerHTML = `
        ${renderMochiKumaSvg(36)}
        <div>
          <p class="font-bold text-sm text-[#3D352E]">${escapeHtml(text)}</p>
          ${acornGain > 0 ? `<p class="text-xs font-bold text-[#4B8364]">🌰 どんぐり +${acornGain}個 獲得！</p>` : ''}
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 350);
      }, 3200);
      renderApp();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function copyToClipboard(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(msg);
      } catch (e) {
        showToast('コピーに失敗しました');
      }
      document.body.removeChild(ta);
    }

    // --- GitHubアップロード用の完全クリーンHTMLを生成する関数 ---
    function generateCleanStandaloneHtml() {
      const scriptContent = document.getElementById('main-app-script').textContent;
      const openTag = '<' + 'script id="main-app-script">';
      const closeTag = '</' + 'script>';
      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>中学受験 伴走ナビ - パーソナルコーチ</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F3EFE6;
      color: #3D352E;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #D8C5A5; border-radius: 9999px; }
    .btn-press:active { transform: scale(0.97); }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="min-h-screen"></div>
  <div id="toast-container" class="fixed top-5 right-5 z-50 pointer-events-none"></div>
  ${openTag}${scriptContent}${closeTag}
</body>
</html>`;
    }

    window.copyCleanHtmlForGithub = function() {
      const cleanHtml = generateCleanStandaloneHtml();
      copyToClipboard(cleanHtml, '✅ GitHub貼り付け用の完全なHTMLコードをコピーしました！');
    };

    window.downloadCleanHtmlForGithub = function() {
      const cleanHtml = generateCleanStandaloneHtml();
      const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('⬇️ index.html をダウンロードしました！そのままGitHubにアップロードできます。');
    };

    function getCoachStage(acorns) {
      if (acorns < 50) return { level: 1, title: 'ふたばコーチ', badge: '🌱', next: 50, desc: 'テスト登録や解き直しで「どんぐり」が集まるよ！' };
      if (acorns < 150) return { level: 2, title: 'わかばコーチ', badge: '🌿', next: 150, desc: 'いいペース！コツコツ復習する習慣がついてきたね。' };
      if (acorns < 300) return { level: 3, title: 'みのりの木コーチ', badge: '🌳', next: 300, desc: '苦手な単元が少しずつ得意に変わってきているよ！' };
      return { level: 4, title: '大樹のマスターコーチ', badge: '👑🌳', next: 500, desc: '2年間の積み重ねが大きな力になっているよ！自信をもっていこう！' };
    }

    function getAllQuestions() {
      const list = [];
      state.tests.forEach(t => {
        (t.questions || []).forEach(q => {
          list.push({
            ...q,
            testId: t.id,
            testName: t.name,
            testGrade: t.grade || '4年',
            testType: t.type,
            testCourse: t.course || 'Bクラス',
            testDate: t.date,
            testFiles: t.files || {},
            isSolved: state.solvedQuestionIds.includes(q.id)
          });
        });
      });
      return list;
    }

    function getUnitStatsMap() {
      const map = {};
      getAllQuestions().forEach(q => {
        const key = `${q.subject}:${q.unit}`;
        if (!map[key]) {
          map[key] = { subject: q.subject, unit: q.unit, total: 0, correct: 0, missedHighAcc: 0, questions: [] };
        }
        map[key].total += 1;
        if (q.isCorrect) map[key].correct += 1;
        else if (q.accuracyRate >= state.accuracyThreshold) map[key].missedHighAcc += 1;
        map[key].questions.push(q);
      });
      return map;
    }

    function renderSvgChart(chartData, validSchools) {
      if (chartData.length === 0) {
        return `
          <div class="bg-[#F5F2EB] border border-dashed border-[#C9BFA8] rounded-2xl h-56 p-6 flex flex-col items-center justify-center text-center relative overflow-hidden">
            <svg class="absolute inset-0 w-full h-full opacity-20 pointer-events-none" viewBox="0 0 400 180">
              <path d="M 20 150 L 120 115 L 210 120 L 300 75 L 380 50" fill="none" stroke="#7A6F63" stroke-width="3" stroke-dasharray="6 6" />
              <line x1="20" y1="20" x2="20" y2="160" stroke="#7A6F63" stroke-width="2" stroke-dasharray="4 4" />
              <line x1="20" y1="160" x2="380" y2="160" stroke="#7A6F63" stroke-width="2" stroke-dasharray="4 4" />
            </svg>
            <p class="text-xs sm:text-sm font-bold text-[#5C5248] leading-relaxed z-10 max-w-xs">
              テストを登録すると、ここに成績の推移と志望校（最大5校）との差分がグラフで表示されます
            </p>
            <button onclick="window.navToUpload()" class="mt-3 z-10 bg-white hover:bg-[#FAF6F0] text-[#4B8364] border border-[#4B8364] text-xs font-bold px-4 py-1.5 rounded-full shadow-sm">
              ＋ 最初のテストを入力する
            </button>
          </div>
        `;
      }

      const width = 600;
      const height = 230;
      const padL = 40;
      const padR = 100;
      const padT = 20;
      const padB = 35;
      const plotW = width - padL - padR;
      const plotH = height - padT - padB;

      const metric = state.chartMetric;
      const values = chartData.map(d => Number(d[metric]) || 0);
      const schoolVals = metric === 'deviation' ? validSchools.map(s => Number(s.targetDeviation) || 0) : [];
      const allVals = [...values, ...schoolVals];

      let minY = metric === 'deviation' ? 35 : 0;
      let maxY = metric === 'deviation' ? 75 : Math.max(100, ...allVals);
      if (metric === 'deviation' && allVals.length > 0) {
        minY = Math.min(35, Math.floor(Math.min(...allVals) - 5));
        maxY = Math.max(75, Math.ceil(Math.max(...allVals) + 5));
      }

      const getY = val => (maxY === minY ? padT + plotH / 2 : padT + plotH - ((val - minY) / (maxY - minY)) * plotH);
      const getX = idx => (chartData.length <= 1 ? padL + plotW / 2 : padL + (idx / (chartData.length - 1)) * plotW);

      const lineColor = SUBJECT_STYLES[state.chartSubject].hex;
      const points = chartData.map((d, i) => `${getX(i)},${getY(d[metric])}`).join(' ');
      const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => Math.round(minY + t * (maxY - minY)));

      let schoolLinesSvg = '';
      if (metric === 'deviation') {
        schoolLinesSvg = validSchools.map(s => {
          const y = getY(Number(s.targetDeviation));
          return `
            <g>
              <line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="${s.color}" stroke-dasharray="5 4" stroke-width="1.8" />
              <text x="${width - padR + 5}" y="${y + 4}" font-size="10" fill="${s.color}" font-weight="bold">
                ${escapeHtml(s.name.slice(0, 7))}(${s.targetDeviation})
              </text>
            </g>
          `;
        }).join('');
      }

      return `
        <div class="h-60 w-full bg-[#FAF8F5] p-2 rounded-2xl border border-[#EAE3D5]">
          <svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible">
            ${yTicks.map(tick => {
              const y = getY(tick);
              return `
                <line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#E5DEC9" stroke-dasharray="3 3" />
                <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#7A6F63" font-weight="bold">${tick}</text>
              `;
            }).join('')}
            ${schoolLinesSvg}
            ${chartData.length > 1 ? `<polyline fill="none" stroke="${lineColor}" stroke-width="3.5" points="${points}" stroke-linecap="round" stroke-linejoin="round" />` : ''}
            ${chartData.map((d, i) => {
              const cx = getX(i);
              const cy = getY(d[metric]);
              return `
                <g>
                  <circle cx="${cx}" cy="${cy}" r="5.5" fill="${lineColor}" stroke="#FFFDF9" stroke-width="2" />
                  <text x="${cx}" y="${cy - 9}" text-anchor="middle" font-size="11" fill="#3D352E" font-weight="800">${d[metric]}</text>
                  <text x="${cx}" y="${height - 10}" text-anchor="middle" font-size="10" fill="#7A6F63" font-weight="bold">${escapeHtml(d.name.slice(0, 8))}</text>
                </g>
              `;
            }).join('')}
          </svg>
        </div>
      `;
    }

    function renderApp() {
      const app = document.getElementById('app');

      if (state.isLocked) {
        app.innerHTML = `
          <div class="min-h-screen bg-[#F3EFE6] text-[#3D352E] flex items-center justify-center p-4">
            <div class="bg-[#FFFDF9] border-2 border-[#D8C5A5] rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-lg text-center space-y-5">
              <div class="flex justify-center">
                <div class="bg-[#F9F6F0] p-3 rounded-full border border-[#E2D9C8]">
                  ${renderMochiKumaSvg(68)}
                </div>
              </div>
              <div class="space-y-1.5">
                <span class="inline-flex items-center gap-1 bg-[#E6EFE9] text-[#2C5840] text-xs font-extrabold px-3 py-1 rounded-full">
                  🔒 ファミリー専用ロック

          理科: { score: Number(s.理科.score) || 0, maxScore: Number(s.理科.maxScore), deviation: Number(s.理科.deviation) || 50 },
          社会: { score: Number(s.社会.score) || 0, maxScore: Number(s.社会.maxScore), deviation: Number(s.社会.deviation) || 50 },
          四科: { score: Number(s.四科.score) || sumScore, maxScore: Number(s.四科.maxScore), deviation: Number(s.四科.deviation) || avgDev }
        },
        questions: f.questions.filter(q => q.unit.trim() !== '')
      };

      if (state.editingTestId) {
        state.tests = state.tests.map(t => (t.id === state.editingTestId ? testData : t));
      } else {
        state.tests.push(testData);
      }

      let addedCards = 0;
      testData.questions.forEach(q => {
        if (!q.isCorrect || q.accuracyRate >= 40) {
          const front = `【${q.unit}】${q.questionSummary}（${testData.name} ${q.number}）`;
          if (!state.flashcards.some(c => c.front === front)) {
            state.flashcards.push({
              id: `fc-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              subject: q.subject,
              unit: q.unit,
              front: front,
              back: q.wrongAnswerNote ? `【注意点】${q.wrongAnswerNote}（週報正答率: ${q.accuracyRate}%）` : `【重要ポイント】解法の手順を確認しよう！（正答率: ${q.accuracyRate}%）`
            });
            addedCards++;
          }
        }
      });

      state.studyLogs.unshift({
        id: `log-${Date.now()}`,
        date: new Date().toLocaleDateString('ja-JP'),
        title: `${state.editingTestId ? 'テスト更新' : 'テスト登録'}：${testData.name}`
      });

      state.editingTestId = null;
      state.uploadForm = createInitialUploadForm();
      saveState();
      showToast(`「${testData.name}」を保存しました！（暗記カード+${addedCards}枚）`, 20);
      window.navTo('home');
    };

    window.editTest = function(testId) {
      const t = state.tests.find(x => x.id === testId);
      if (!t) return;
      state.editingTestId = t.id;
      state.uploadForm = {
        name: t.name,
        grade: t.grade || '4年',
        type: t.type,
        date: t.date,
        course: t.course || 'Bクラス',
        scores: {
          算数: { score: t.subjects?.算数?.score ?? '', maxScore: t.subjects?.算数?.maxScore ?? 200, deviation: t.subjects?.算数?.deviation ?? '' },
          国語: { score: t.subjects?.国語?.score ?? '', maxScore: t.subjects?.国語?.maxScore ?? 150, deviation: t.subjects?.国語?.deviation ?? '' },
          理科: { score: t.subjects?.理科?.score ?? '', maxScore: t.subjects?.理科?.maxScore ?? 100, deviation: t.subjects?.理科?.deviation ?? '' },
          社会: { score: t.subjects?.社会?.score ?? '', maxScore: t.subjects?.社会?.maxScore ?? 100, deviation: t.subjects?.社会?.deviation ?? '' },
          四科: { score: t.subjects?.四科?.score ?? '', maxScore: t.subjects?.四科?.maxScore ?? 550, deviation: t.subjects?.四科?.deviation ?? '' }
        },
        files: t.files || { questionPapers: [], answerSheets: [], explanations: [], accuracySheets: [] },
        questions: (t.questions && t.questions.length > 0) ? [...t.questions] : []
      };
      state.activeView = 'upload';
      renderApp();
      window.scrollTo(0, 0);
    };

    window.deleteTest = function(testId, name) {
      state.tests = state.tests.filter(t => t.id !== testId);
      saveState();
      showToast(`「${name}」を削除しました`);
      renderApp();
    };

    window.startSampleDojo = function(mode) {
      state.activeDojo = {
        id: 'sample-1',
        subject: '算数',
        unit: '和差算',
        accuracyRate: 55,
        mode: mode,
        analysis: '差の半分とお金のやり取りでミスが出やすいポイントを復習します。',
        problemText: 'AさんとBさんが同じ金額を出し合って、クッキーを24枚買いました。分けた後でAさんがBさんより6枚多くもらうことになり、AさんはBさんに150円渡しました。クッキー1枚の値段は何円ですか。',
        expectedAnswer: '50円',
        hint1: '24枚を同じ数ずつ分けると1人12枚です。Aさんは何枚もらったか求めましょう。',
        hint2: 'Aさんは(24+6)÷2=15枚もらいました。予定の12枚より何枚多くもらったか考えます。',
        steps: [
          'ステップ1：和差算で実際の枚数を求めます。Aさんは(24+6)÷2=15枚、Bさんは24-15=9枚です。',
          'ステップ2：最初は2人とも12枚分のお金を出していました。',
          'ステップ3：Aさんは15-12=3枚多くもらったので150円渡しました。150÷3=50円です。'
        ]
      };
      renderApp();
      window.scrollTo(0, 200);
    };

    window.startRealDojo = function(qId, mode) {
      const q = getAllQuestions().find(x => x.id === qId);
      if (!q) return;
      state.activeDojo = {
        id: q.id,
        subject: q.subject,
        unit: q.unit,
        accuracyRate: q.accuracyRate,
        mode: mode,
        analysis: q.wrongAnswerNote ? `答案メモ「${q.wrongAnswerNote}」を踏まえた類題です。` : `週報正答率${q.accuracyRate}%の頻出単元です。`,
        problemText: mode === 'review'
          ? `【${q.unit}・類題】${q.questionSummary}（答案の間違いポイントに注意して解いてみよう！）`
          : `【${q.unit}・応用問題】${q.questionSummary}を発展させた入試レベルの演習問題です。`,
        expectedAnswer: '解説を参照',
        hint1: `まずは「${q.unit}」の線分図やキーワードを書き出してみましょう。`,
        hint2: `条件の差や変化前後の違いに注目すると式が立ちます。`,
        steps: [
          `ステップ1：問題で問われている数値や条件を整理します。`,
          `ステップ2：「${q.unit}」の基本公式や考え方を当てはめます。`,
          `ステップ3：計算ミスがないか見直して答えをまとめます。`
        ]
      };
      renderApp();
      window.scrollTo(0, 200);
    };

    window.startDojoFromMap = function(subject, unit) {
      const q = getAllQuestions().find(x => x.subject === subject && x.unit === unit);
      if (q) {
        window.startRealDojo(q.id, q.isCorrect ? 'advanced' : 'review');
      } else {
        window.navTo('dojo');
        window.startSampleDojo('review');
      }
    };

    window.showDojoHint = function() {
      const box = document.getElementById('dojoHintBox');
      if (box && state.activeDojo) {
        box.innerHTML = `
          <div class="bg-[#F5EFE0] border border-[#E2D3B3] rounded-2xl p-4 text-xs sm:text-sm font-medium">
            <strong>ヒント：</strong> ${escapeHtml(state.activeDojo.hint1)}<br/>
            <strong>ポイント：</strong> ${escapeHtml(state.activeDojo.hint2)}
          </div>
        `;
      }
    };

    window.revealDojoSolution = function() {
      const box = document.getElementById('dojoSolutionBox');
      if (box) box.classList.remove('hidden');
    };

    window.clearDojoQuestion = function(qId) {
      if (!state.solvedQuestionIds.includes(qId)) {
        state.solvedQuestionIds.push(qId);
      }
      state.activeDojo = null;
      saveState();
      showToast('演習をクリアしました！', 20);
      renderApp();
    };

    window.setCardSubjectFilter = function(sub) {
      state.cardSubjectFilter = sub;
      state.currentCardIndex = 0;
      state.isCardFlipped = false;
      renderApp();
    };

    window.toggleCardFlip = function() {
      state.isCardFlipped = !state.isCardFlipped;
      renderApp();
    };

    window.nextCard = function(len) {
      state.isCardFlipped = false;
      state.currentCardIndex = (state.currentCardIndex + 1) % len;
      renderApp();
    };

    window.prevCard = function(len) {
      state.isCardFlipped = false;
      state.currentCardIndex = (state.currentCardIndex - 1 + len) % len;
      renderApp();
    };

    window.markCardLearned = function(len) {
      showToast('覚えたね！どんぐり+5個', 5);
      window.nextCard(len);
    };

    window.addNewCard = function() {
      const sub = document.getElementById('newCardSubject')?.value || '理科';
      const unit = document.getElementById('newCardUnit')?.value || '';
      const front = document.getElementById('newCardFront')?.value || '';
      const back = document.getElementById('newCardBack')?.value || '';
      if (!front.trim() || !back.trim()) {
        showToast('問題と答えを入力してください');
        return;
      }
      state.flashcards.push({
        id: `fc-${Date.now()}`,
        subject: sub,
        unit: unit.trim(),
        front: front.trim(),
        back: back.trim()
      });
      saveState();
      showToast('暗記カードを追加しました！', 10);
      renderApp();
    };

    window.autoCreateCardsFromTests = function() {
      const allQ = getAllQuestions();
      let count = 0;
      allQ.forEach(q => {
        if (!q.isCorrect || q.accuracyRate >= 40) {
          const front = `【${q.unit}】${q.questionSummary}（${q.testName} ${q.number}）`;
          if (!state.flashcards.some(c => c.front === front)) {
            state.flashcards.push({
              id: `fc-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              subject: q.subject,
              unit: q.unit,
              front: front,
              back: q.wrongAnswerNote ? `【注意点】${q.wrongAnswerNote}` : `【要点】解法を確認しよう！（正答率: ${q.accuracyRate}%）`
            });
            count++;
          }
        }
      });
      saveState();
      showToast(count > 0 ? `${count}枚のカードを自動登録しました！` : 'すべての重要問題は登録済みです', count > 0 ? 15 : 0);
      renderApp();
    };

    window.saveSchools = function() {
      saveState();
      showToast('志望校の設定を保存しました！', 5);
      window.navTo('home');
    };

    window.exportDataCode = function() {
      const payload = {
        studentName: state.studentName,
        tests: state.tests,
        schools: state.schools,
        flashcards: state.flashcards,
        acorns: state.acorns,
        solvedQuestionIds: state.solvedQuestionIds,
        studyLogs: state.studyLogs
      };
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      copyToClipboard(b64, '引き継ぎコードをコピーしました！もう一方の端末に貼り付けてください。');
    };

    window.importDataCode = function() {
      const input = document.getElementById('importDataInput')?.value || '';
      if (!input.trim()) return;
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(input.trim()))));
        if (decoded.tests) state.tests = decoded.tests;
        if (decoded.schools) state.schools = decoded.schools;
        if (decoded.flashcards) state.flashcards = decoded.flashcards;
        if (decoded.studentName !== undefined) state.studentName = decoded.studentName;
        if (typeof decoded.acorns === 'number') state.acorns = decoded.acorns;
        if (Array.isArray(decoded.solvedQuestionIds)) state.solvedQuestionIds = decoded.solvedQuestionIds;
        saveState();
        showToast('データを同期・復元しました！');
        window.navTo('home');
      } catch (e) {
        showToast('コードの形式が正しくありません');
      }
    };

    window.changePasscode = function() {
      const input = document.getElementById('newPasscodeInput')?.value || '';
      if (!input.trim()) {
        showToast('新しい合言葉を入力してください');
        return;
      }
      state.passcode = input.trim();
      saveState();
      showToast('合言葉を更新しました！');
      renderApp();
    };

    loadState();
    renderApp();
  </script>
</body>
</html>
